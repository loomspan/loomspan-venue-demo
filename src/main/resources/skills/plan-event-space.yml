name: planEventSpace
description: Investigate rooms for an immutable meeting or two-room workshop and select the least expensive valid assignment.
model: planner
planning_mode: true
max_steps: 7
allowed_skills:
  - name: listVenueRooms
    required: true
    max_tasks: 1
  - name: checkRoomAvailability
    max_tasks: 3
  - name: checkWorkshopSpaceCandidates
    max_tasks: 1
prompt: |
  Use the supplied eventType BEFORE generating the plan. The plan is fixed before
  tool execution, so do not plan a meeting check and expect to change it later.
  Call listVenueRooms with the supplied eventId to read persisted requirements.
  For WORKSHOP, call checkWorkshopSpaceCandidates after reading the requirements.
  It checks all six assignments including both equal breakout groups. Choose the
  lowest totalCents assignment with valid=true, copying roomId and breakoutRoomId.
  Do not use single-room checks for workshops: the second room only seats half the
  attendees. If none are valid return both IDs null. For MEETING use the following
  single-room workflow and return breakoutRoomId null.
  Choose which rooms need availability checks using capacity and budget facts.
  Call checkRoomAvailability for candidate rooms, with the exact eventId and roomId.
  Prefer the lowest priced valid room. A room exactly at capacity is valid.
  The checkRoomAvailability return value is authoritative: valid=true and
  violations=[] means that room IS available, fits capacity, and fits budget.
  Preserve every successful candidate across later checks. A failed check of a
  different room does not invalidate a previously valid room. Select the cheapest
  room with valid=true from the actual returned records, even if the last room
  checked was invalid. Plan titles, task notes and anticipated outcomes are not
  venue facts. Never describe a valid=true room as unavailable.
  If the cheapest suitable room is unavailable, investigate the next suitable room.
  If no room is suitable, check a room to establish its violations, then return
  null roomId with a grounded explanation. Do not invent other rooms or layouts.
  Sequential checks are appropriate for this small catalog. No reservations are made.
input_schema:
  type: object
  properties:
    eventId: { type: string }
    eventType: { type: string, enum: [MEETING, WORKSHOP] }
  required: [eventId, eventType]
  additionalProperties: false
output_schema:
  type: object
  properties:
    roomId:
      type: string
      nullable: true
      evidence: listVenueRooms and (checkRoomAvailability or checkWorkshopSpaceCandidates)
    breakoutRoomId: { type: string, nullable: true }
    rationale:
      type: string
      evidence: listVenueRooms and (checkRoomAvailability or checkWorkshopSpaceCandidates)
  required: [roomId, breakoutRoomId, rationale]
  additionalProperties: false
output_schema_max_retries: 2
